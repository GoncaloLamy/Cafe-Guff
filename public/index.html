<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Guf</title>
</head>
<body>
    <header>
        <h1>Café Guf</h1>
        <p>Logget ind som: <span id="current-role">Indlæser...</span></p>
        <button id="logout-button" type="button">Log ud</button>
        <p id="logout-error" role="alert"></p>
    </header>
    <main>
        <section aria-labelledby="weather-heading">
            <h2 id="weather-heading">Vejret i København</h2>
            <a id="weather-link" href="/weather" aria-label="Se detaljeret vejrudsigt">
                <span id="weather-icon" aria-hidden="true">⛅</span>
                <span id="weather-condition">Henter vejret...</span>
                <span id="weather-temperature"></span>
            </a>
        </section>
    </main>
    <script src="/js/session.js" defer></script>
    <script src="/js/app.js" defer></script>
</body>
</html>
