name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Postman mod kørende server
        run: |
          npm start &
          npx --yes wait-on http-get://localhost:3000/api/menu --timeout 30000
          npm run postman
